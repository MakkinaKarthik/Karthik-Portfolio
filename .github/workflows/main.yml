name: Fix HTML Username Instances

on:
  workflow_dispatch: 

jobs:
  replace-username:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace all instances in HTML files
        run: |
          # This will target only .html files and swap the username text anywhere it appears
          find . -type f -name "*.html" -exec perl -pi -e 's/Karthik-630/MakkinaKarthik/g' {} +

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refactor: Clean up remaining username instances in HTML"
