name: Update GitHub Username URL

on:
  workflow_dispatch: 

jobs:
  replace-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Replace Username URL
        run: |
          find . -type f -not -path '*/.*' -exec perl -pi -e 's|https://github.com|https://github.com|g' {} +

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refactor: Update profile URL to MakkinaKarthik"
