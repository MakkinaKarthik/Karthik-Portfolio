name: Update GitHub Username URL

on:
  workflow_dispatch: # Allows you to manually click "Run" on the website

jobs:
  replace-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Replace Username URL
        run: |
          # Finds all files and swaps your old GitHub URL with the new one
          find . -type f -not -path '*/.*' -exec sed -i 's#https://github.com' {} +

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refactor: Update profile URL to MakkinaKarthik"
